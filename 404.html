<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página não encontrada — Opticalia Famões</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f8ff; color: #1A1A1A; display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 2rem; }
    .wrap { max-width: 480px; }
    .code { font-size: 6rem; font-weight: 700; color: #0057B8; line-height: 1; }
    h1 { font-size: 1.5rem; color: #003D82; margin: 1rem 0 0.5rem; }
    p { color: #666; font-size: 15px; margin-bottom: 2rem; }
    a { display: inline-block; background: #0057B8; color: #fff; text-decoration: none; padding: 0.75rem 2rem; border-radius: 8px; font-weight: 600; font-size: 15px; }
    a:hover { background: #003D82; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>Página não encontrada</h1>
    <p>A página que procura não existe ou foi movida.</p>
    <a href="/">Voltar ao início</a>
  </div>
</body>
</html>
